<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/login.css" />
</head>
<body class="min-h-screen bg-gradient-to-br from-red-100 via-pink-100 to-rose-100 flex items-center justify-center px-4">

  <div class="max-w-md w-full">

    <!-- Header -->
    <div class="text-center mb-10">
      <h1 class="text-5xl font-bold text-red-800 mb-2 tracking-tight">Admin Portal</h1>
      <p class="text-red-600 text-lg">Secure login for administrators</p>
    </div>

    <!-- Login Card -->
    <div id="loginCard" class="glass rounded-3xl shadow-xl p-8 md:p-10 transform hover:scale-[1.01] transition-all duration-300">
      <h2 class="text-3xl font-bold text-red-800 text-center mb-8">Login</h2>

      <!-- Error Message -->
      <div id="errorMessage" class="hidden mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm">
        <strong>Error:</strong> <span id="errorText"></span>
      </div>

      <!-- Success Message -->
      <div id="successMessage" class="hidden mb-6 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm">
        <strong>Success:</strong> <span id="successText"></span>
      </div>

      <form id="loginForm" class="space-y-6">

        <!-- Admin Email -->
        <div>
          <label class="block text-sm font-medium text-red-700 mb-2">Admin Email</label>
          <input
            type="email"
            id="adminEmail"
            required
            placeholder="Enter your admin email"
            class="w-full px-5 py-4 bg-white/80 border border-red-300 rounded-xl text-gray-800 placeholder-red-400 input-focus transition-all focus:bg-white"
          />
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-red-700 mb-2">Password</label>
          <input
            type="password"
            id="password"
            required
            placeholder="Enter your password"
            class="w-full px-5 py-4 bg-white/80 border border-red-300 rounded-xl text-gray-800 placeholder-red-400 input-focus transition-all focus:bg-white"
          />
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submitBtn"
          class="w-full py-4 bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 text-white font-semibold text-lg rounded-xl shadow-lg transform hover:-translate-y-1 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
        >
          <span id="btnText">Sign In as Admin</span>
        </button>

      </form>

      <!-- Backend Connection Status -->
      <div class="mt-6 text-center">
        <p class="text-xs text-gray-500">
          Backend Status: <span id="backendStatus" class="font-semibold">Checking...</span>
        </p>
      </div>
    </div>

  </div>

  <!-- Custom JS -->
  <script src="/static/login.js"></script>
</body>
</html>
